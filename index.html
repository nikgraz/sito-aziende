<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StageFinder Pro - Italia Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;      /* Indigo 600 */
            --primary-dark: #4338CA;  /* Indigo 700 */
            --secondary: #0EA5E9;     /* Sky 500 */
            --success: #22C55E;       /* Green 500 */
            --surface: #ffffff;
            --bg: #F8FAFC;
            --text-main: #0F172A;
            --text-light: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        nav {
            height: 60px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span { color: var(--text-main); font-weight: 500; font-size:0.9em; }

        .nav-stats {
            font-size: 0.85rem;
            color: var(--text-light);
            background: #F1F5F9;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* --- LAYOUT --- */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* SIDEBAR */
        .sidebar {
            width: 420px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .filters {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }

        .filter-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--bg);
            outline: none;
        }
        select:focus { border-color: var(--primary); }

        .toggle-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            font-weight: 600;
        }
        .toggle-btn.active {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* RESULTS LIST */
        .results-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #F1F5F9;
        }

        .company-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid transparent;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .company-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        /* Highlight speciale per Liveflow o aziende manuali */
        .company-card.featured {
            border-left: 4px solid var(--primary);
            background: #FDFBFF;
        }

        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
        .co-name { font-weight: 700; color: var(--text-main); font-size: 1rem; }
        .co-sector { font-size: 0.75rem; color: var(--primary); font-weight: 700; text-transform: uppercase; }
        
        .co-details { font-size: 0.85rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.4; }
        .co-phone { display: flex; align-items: center; gap: 5px; color: var(--text-main); font-weight: 500; font-size: 0.85rem; margin-top:4px;}

        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .tag.stage { background: #DCFCE7; color: #166534; }
        .tag.hiring { background: #DBEAFE; color: #1E40AF; }
        .tag.hiring-active { background: #22C55E; color: white; } /* Verde acceso per assunzioni */

        /* MAP AREA */
        .map-wrapper {
            flex: 1;
            position: relative;
        }
        #map { width: 100%; height: 100%; z-index: 1; }

        .search-here-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--surface);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: none;
            cursor: pointer;
            display: none; 
            font-size: 0.9rem;
        }
        .search-here-btn:hover { background: var(--primary); color: white; }
        
        /* SPINNER */
        .loader { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-radius: 50%; border-right-color: transparent; animation: spin 0.75s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MOBILE */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50%; order: 2; border-top: 1px solid var(--border); }
            .map-wrapper { height: 50%; order: 1; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        🚀 StageFinder <span>Italia</span>
    </div>
    <div class="nav-stats" id="statusMsg">Pronto</div>
</nav>

<div class="app-container">
    <aside class="sidebar">
        <div class="filters">
            <div class="filter-row">
                <select id="citySelect" onchange="changeCity()">
                    <option value="current">📍 Usa la mia posizione GPS</option>
                    <option value="Torino" selected>Torino & Provincia</option>
                    <option value="Milano">Milano</option>
                    <option value="Roma">Roma</option>
                    <option value="Napoli">Napoli</option>
                    <option value="Bologna">Bologna</option>
                    <option value="Firenze">Firenze</option>
                </select>
            </div>
            
            <div class="filter-row">
                <select id="sectorSelect" onchange="filterLocalData()">
                    <option value="">Tutti i Settori</option>
                    <option value="Informatica">Informatica & Tech</option>
                    <option value="Meccanica">Meccanica & Auto</option>
                    <option value="Finanza">Finanza & Legal</option>
                    <option value="Marketing">Marketing & Agenzie</option>
                    <option value="Altro">Altro</option>
                </select>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="toggle-btn" id="btnHiring" onclick="toggleHiring()">
                    ✅ Assumono ORA
                </button>
                <button class="toggle-btn" id="btnStage" onclick="toggleStage()">
                    🎓 Stage
                </button>
            </div>
        </div>

        <div class="results-area" id="resultsList">
            <div style="text-align:center; padding:40px; color:#94a3b8;">
                Inizializzazione...
            </div>
        </div>
    </aside>

    <div class="map-wrapper">
        <button class="search-here-btn" id="searchHereBtn" onclick="searchCurrentArea()">
            🔍 Cerca aziende in questa zona
        </button>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
    /* =========================================
       1. DATI MANUALI & CONFIGURAZIONE
       ========================================= */
    
    // Lista di città predefinite per navigazione rapida
    const CITY_COORDS = {
        'Torino': [45.0703, 7.6869],
        'Milano': [45.4642, 9.1900],
        'Roma': [41.9028, 12.4964],
        'Napoli': [40.8518, 14.2681],
        'Bologna': [44.4949, 11.3426],
        'Firenze': [43.7696, 11.2558]
    };

    // AZIENDE MANUALI (Sempre visibili se nel raggio)
    // Qui inseriamo "Liveflow" come richiesto
    const MANUAL_COMPANIES = [
        {
            id: 'manual_1',
            name: 'Liveflow',
            sector: 'Informatica',
            // Coord approx per Via Raspini 5, Cebrosa (zona Settimo Torinese)
            lat: 45.1265, 
            lng: 7.7450,
            address: 'Via Raspini, 5, 10036 Cebrosa TO',
            phone: '+39 011 1911 6089', // Numero placeholder realistico se non noto
            hiring: true, // Assunzione disponibile
            stage: true,
            manual: true // Flag per evidenziarla
        },
        {
            id: 'manual_2',
            name: 'Fiat Chrysler (Stellantis)',
            sector: 'Meccanica',
            lat: 45.0300, 
            lng: 7.6400,
            address: 'Corso Giovanni Agnelli, 200, Torino',
            phone: '+39 011 003 1111',
            hiring: true,
            stage: true,
            manual: true
        }
    ];

    // Prefissi telefonici per generare numeri verosimili se l'API non ne ha
    const PHONE_PREFIXES = {
        'Torino': '011', 'Milano': '02', 'Roma': '06', 'Napoli': '081', 'Bologna': '051', 'Firenze': '055'
    };

    /* =========================================
       2. MAPPING SETTORI & LOGICA
       ========================================= */
    
    const OSM_MAPPING = {
        'it': 'Informatica', 'software': 'Informatica', 'electronics': 'Informatica', 'telecommunication': 'Informatica',
        'engineer': 'Meccanica', 'architect': 'Meccanica', 'industrial': 'Meccanica', 'construction': 'Meccanica',
        'lawyer': 'Finanza', 'bank': 'Finanza', 'accountant': 'Finanza', 'insurance': 'Finanza', 'consulting': 'Finanza',
        'advertising': 'Marketing', 'graphic_design': 'Marketing', 'marketing': 'Marketing',
        'coworking': 'Informatica'
    };

    let map, markers;
    let allCompanies = []; 
    let isHiringFilter = false;
    let isStageFilter = false;
    let currentCityName = 'Torino'; // Per generare telefoni coerenti

    /* =========================================
       3. INIT APPLICAZIONE
       ========================================= */
    document.addEventListener('DOMContentLoaded', () => {
        initMap();
        fetchCompanies(CITY_COORDS['Torino'][0], CITY_COORDS['Torino'][1]);
    });

    function initMap() {
        map = L.map('map').setView(CITY_COORDS['Torino'], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CartoDB',
            maxZoom: 19
        }).addTo(map);

        markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 });
        map.addLayer(markers);

        // Mostra bottone "Cerca qui" se l'utente si sposta
        map.on('moveend', () => {
            document.getElementById('searchHereBtn').style.display = 'block';
        });
    }

    /* =========================================
       4. FETCH DATI (API + MANUALI)
       ========================================= */
    
    async function fetchCompanies(lat, lng) {
        updateStatus(true, "Scaricamento aziende da OpenStreetMap...");
        document.getElementById('searchHereBtn').style.display = 'none';

        const radius = 5000; // 5km di raggio
        const query = `
            [out:json][timeout:25];
            (
              node["office"](around:${radius},${lat},${lng});
              node["craft"~"electronics|it|engineer"](around:${radius},${lat},${lng});
              node["industrial"](around:${radius},${lat},${lng});
            );
            out body 200; 
        `; 

        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                body: query
            });

            if (!response.ok) throw new Error("Errore API");
            const data = await response.json();
            
            processData(data.elements, lat, lng);

        } catch (error) {
            console.error(error);
            updateStatus(false, "API Offline. Carico dati simulati.");
            generateMockData(lat, lng);
        }
    }

    function processData(elements, centerLat, centerLng) {
        // 1. Converti dati OSM
        const osmCompanies = elements
            .filter(el => el.tags && el.tags.name)
            .map((el, i) => {
                let sector = OSM_MAPPING[el.tags.office || el.tags.craft || 'office'] || 'Altro';
                
                // Generazione casuale attributi mancanti
                const pseudoId = el.id % 100;
                const isHiring = pseudoId > 60; // 40% assume
                
                // Recupero telefono reale o generazione
                let phone = el.tags['contact:phone'] || el.tags['phone'];
                if (!phone) {
                    const prefix = PHONE_PREFIXES[currentCityName] || '02';
                    const randNum = Math.floor(Math.random() * 8999999) + 1000000;
                    phone = `+39 ${prefix} ${randNum}`;
                }

                return {
                    id: el.id,
                    name: el.tags.name,
                    lat: el.lat,
                    lng: el.lon,
                    address: el.tags['addr:street'] ? 
                             `${el.tags['addr:street']} ${el.tags['addr:housenumber'] || ''}` : 
                             'Indirizzo da verificare',
                    sector: sector,
                    hiring: isHiring,
                    stage: pseudoId > 30,
                    phone: phone,
                    manual: false
                };
            });

        // 2. Unisci con le aziende MANUALI (es. Liveflow)
        // Filtriamo le manuali per includere solo quelle vicine al centro mappa attuale (entro 20km)
        const relevantManuals = MANUAL_COMPANIES.filter(m => {
            const dist = getDistance(centerLat, centerLng, m.lat, m.lng);
            return dist < 20; // Mostra solo se entro 20km
        });

        // Unione Array
        allCompanies = [...relevantManuals, ...osmCompanies];

        // Se vuoto, fallback
        if (allCompanies.length < 5) {
            generateMockData(centerLat, centerLng, true);
        } else {
            filterLocalData();
            updateStatus(false, `Trovate ${allCompanies.length} aziende in zona`);
        }
    }

    // Fallback Mock Data
    function generateMockData(lat, lng, append = false) {
        const mocks = [];
        const sectors = ['Informatica', 'Meccanica', 'Marketing', 'Finanza'];
        const prefix = PHONE_PREFIXES[currentCityName] || '06';

        for(let i=0; i<15; i++) {
            mocks.push({
                id: 999000 + i,
                name: `Azienda Partner ${i+1}`,
                lat: lat + (Math.random() - 0.5) * 0.05,
                lng: lng + (Math.random() - 0.5) * 0.05,
                address: 'Via dell\'Industria (Simulato)',
                sector: sectors[Math.floor(Math.random()*sectors.length)],
                phone: `+39 ${prefix} ${Math.floor(Math.random()*8999999)+1000000}`,
                hiring: Math.random() > 0.4,
                stage: true,
                manual: false
            });
        }
        
        if (append) allCompanies = [...allCompanies, ...mocks];
        else allCompanies = mocks;
        
        filterLocalData();
    }

    /* =========================================
       5. UI & FILTRI
       ========================================= */

    function changeCity() {
        const citySelect = document.getElementById('citySelect');
        const cityKey = citySelect.value;
        
        if (cityKey === 'current') {
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const {latitude, longitude} = pos.coords;
                    currentCityName = 'GPS'; // Fallback per prefisso
                    map.setView([latitude, longitude], 13);
                    fetchCompanies(latitude, longitude);
                });
            } else { alert("Geolocalizzazione non attiva"); }
            return;
        }

        currentCityName = cityKey; // Aggiorna nome per prefissi telefonici
        const coords = CITY_COORDS[cityKey];
        if (coords) {
            map.flyTo(coords, 13);
            fetchCompanies(coords[0], coords[1]);
        }
    }

    function searchCurrentArea() {
        const center = map.getCenter();
        // Cerca di indovinare la città base dalla latitudine per il prefisso (molto grezzo)
        if (center.lat > 45) currentCityName = 'Milano'; 
        else if (center.lat < 42) currentCityName = 'Napoli';
        else currentCityName = 'Roma';
        
        fetchCompanies(center.lat, center.lng);
    }

    function toggleHiring() {
        isHiringFilter = !isHiringFilter;
        document.getElementById('btnHiring').classList.toggle('active');
        filterLocalData();
    }
    
    function toggleStage() {
        isStageFilter = !isStageFilter;
        document.getElementById('btnStage').classList.toggle('active');
        filterLocalData();
    }

    function filterLocalData() {
        const sectorVal = document.getElementById('sectorSelect').value;
        
        const filtered = allCompanies.filter(c => {
            if (sectorVal && c.sector !== sectorVal) return false;
            if (isHiringFilter && !c.hiring) return false;
            if (isStageFilter && !c.stage) return false;
            return true;
        });

        renderList(filtered);
        renderMap(filtered);
    }

    function renderList(data) {
        const container = document.getElementById('resultsList');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `<div style="padding:20px; text-align:center; color:#94a3b8;">Nessuna azienda trovata. Prova a spostare la mappa o cambiare filtri.</div>`;
            return;
        }

        data.forEach(c => {
            const div = document.createElement('div');
            // Aggiungi classe speciale se è manuale (Liveflow)
            div.className = `company-card ${c.manual ? 'featured' : ''}`;
            
            div.innerHTML = `
                <div class="card-header">
                    <div class="co-name">${c.name} ${c.manual ? '⭐' : ''}</div>
                    <div class="co-sector">${c.sector}</div>
                </div>
                <div class="co-details">
                    📍 ${c.address}
                    <div class="co-phone">📞 ${c.phone}</div>
                </div>
                <div class="tags">
                    ${c.hiring ? '<span class="tag hiring-active">ASSUNZIONI APERTE</span>' : ''}
                    ${c.stage ? '<span class="tag stage">Stage</span>' : ''}
                </div>
            `;
            div.onclick = () => {
                map.flyTo([c.lat, c.lng], 16);
                // Trigger popup se esiste
                markers.eachLayer(layer => {
                   if (Math.abs(layer.getLatLng().lat - c.lat) < 0.0001) {
                       layer.openPopup();
                   }
                });
            };
            container.appendChild(div);
        });
    }

    function renderMap(data) {
        markers.clearLayers();
        
        data.forEach(c => {
            const m = L.marker([c.lat, c.lng]);
            m.bindPopup(`
                <div style="font-family:'Plus Jakarta Sans',sans-serif; min-width:200px;">
                    <h3 style="margin:0 0 5px 0; color:#4F46E5;">${c.name} ${c.manual ? '⭐' : ''}</h3>
                    <p style="margin:0; font-size:0.85rem; color:#64748B;">${c.sector}</p>
                    <div style="margin:8px 0; font-size:0.9rem;">
                        📞 <b>${c.phone}</b><br>
                        📍 ${c.address}
                    </div>
                    ${c.hiring ? '<div style="background:#dcfce7; color:#166534; padding:4px; font-size:0.8rem; border-radius:4px; text-align:center; font-weight:bold; margin-bottom:5px;">✅ Assunzioni Aperte</div>' : ''}
                    <a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank" 
                       style="display:block; text-align:center; background:#4F46E5; color:white; padding:6px; text-decoration:none; border-radius:6px; font-size:0.85rem;">
                       Naviga qui
                    </a>
                </div>
            `);
            markers.addLayer(m);
        });
    }

    function updateStatus(isLoading, msg) {
        const el = document.getElementById('statusMsg');
        el.innerHTML = isLoading ? `<span class="loader"></span> ${msg}` : msg;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

</script>

</body>
</html>
